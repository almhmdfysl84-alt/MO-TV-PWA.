name: Ostora provider scaffold tests

on:
  push:
    branches:
      - feature/ostora-provider-scaffold
    paths:
      - "providers/ostora/**"
      - ".github/workflows/ostora-provider-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "providers/ostora/**"
      - ".github/workflows/ostora-provider-tests.yml"

jobs:
  test-normalizer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Ostora metadata tests
        run: node --test providers/ostora/normalize.test.mjs
