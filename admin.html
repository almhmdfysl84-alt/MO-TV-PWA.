<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081321"><title>إدارة MO TV</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:900px;margin:28px auto;padding:0 16px}.admin-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.admin-card h2{margin-top:0}.field{display:grid;gap:7px;margin:12px 0}.field input,.field textarea,.field select{background:#071321;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;width:100%}.field textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.admin-table button{border:0;border-radius:9px;padding:9px 12px;background:var(--gold);color:#091522;font-weight:700}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right}.admin-table .danger{background:#7f1d1d;color:white}.hidden{display:none!important}#notice{margin:12px 0;color:var(--gold);min-height:22px}.back{color:var(--gold);text-decoration:none}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.admin-table{font-size:11px}.admin-table th,.admin-table td{padding:7px 4px}}
</style></head><body><header class="topbar"><a class="back" href="./">← MO TV</a><div class="brand">لوحة <b>الإدارة</b></div></header><main class="admin-wrap">
<section id="login" class="admin-card"><h2>دخول المسؤول</h2><p class="hint">هذه الصفحة خاصة بإدارة المحتوى. دخول الزوار إلى التطبيق لا يتطلب حساباً.</p><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">تسجيل الدخول</button></form></section>
<section id="panel" class="hidden"><div class="admin-card"><div class="section-head"><h2>إضافة / تعديل قناة</h2><button id="logout" class="secondary">تسجيل الخروج</button></div><form id="channelForm"><input id="id" type="hidden"><div class="formgrid">
<div class="field"><label>اسم القناة *</label><input id="title" required maxlength="120"></div><div class="field"><label>التصنيف *</label><select id="category" required></select></div>
<div class="field"><label>وصف مختصر</label><input id="subtitle" maxlength="160"></div><div class="field"><label>ترتيب العرض</label><input id="sort" type="number" value="0"></div>
<div class="field wide"><label>وصف القناة</label><textarea id="description"></textarea></div><div class="field wide"><label>رابط البث HTTPS</label><input id="stream" type="url" placeholder="https://..."></div><div class="field wide"><label>رابط الشعار HTTPS</label><input id="artwork" type="url" placeholder="https://..."></div>
<div class="field"><label><input id="active" type="checkbox" checked> عرض القناة للزوار</label></div></div><div class="actions"><button id="save" type="submit">إضافة القناة</button><button id="reset" type="button" class="secondary">تفريغ الحقول</button></div></form></div>
<div class="admin-card"><h2>القنوات الحالية</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>القناة</th><th>التصنيف</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><div id="notice"></div></main><script src="admin.js"></script></body></html>
